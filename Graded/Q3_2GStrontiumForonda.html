<!DOCTYPE html>
<html>
<head>

<script>

function checkEmpty(field) {
  if (field.value.trim() === "") {
    field.classList.add("invalid");
  } else {
    field.classList.remove("invalid");
  }
}

function saveForm(event) {
  event.preventDefault();

  if (!confirm("Are you sure you want to submit this application?")) {
    return;
  }

  let selectedType = document.querySelector("input[name='type']:checked");

  let formData = {
    idno: document.getElementById("idno").value,
    fName: document.getElementById("fName").value,
    Bday: document.getElementById("Bday").value,
    gmail: document.getElementById("gmail").value,
    no: document.getElementById("no").value,
    gLevel: document.getElementById("gLevel").value,
    type: selectedType ? selectedType.value : "",
    club: document.getElementById("club").value,
    why: document.getElementById("why").value
  };

  let signUps = JSON.parse(localStorage.getItem("signUps")) || [];
  signUps.push(formData);
  localStorage.setItem("signUps", JSON.stringify(signUps));


  window.location.href = "sheet.html";
}

</script>

<style>
body {
  font-family: Arial, sans-serif;
  background-color: #abecb960;
  padding: 50px;
}

form {
  font-family: 'Times New Roman', Times, serif;
  background-color: #365a3e60;
  margin: 45px auto;
  padding: 40px 50px;
  width: 600px;
}

fieldset {
  padding: 20px;
}

legend {
  font-weight: bold;
}

input:focus,
textarea:focus,
select:focus {
  border: 3px solid #7695fd;
  background-color: #99d5ec;
  outline: none;
}

.invalid {
  border: 3px solid rgb(253, 117, 117);
  background-color: #ffd6d6;
}
</style>

</head>

<body>

<form onsubmit="saveForm(event)">

<fieldset>
<legend>Personal Information</legend>

<label>Student ID number:</label>
<input type="number" id="idno" required onblur="checkEmpty(this)"><br><br>

<label>Full Name:</label>
<input type="text" id="fName" required onblur="checkEmpty(this)"><br><br>

<label>Birthday:</label>
<input type="date" id="Bday" required onblur="checkEmpty(this)"><br><br>

<label>Email Address:</label>
<input type="email" id="gmail" required onblur="checkEmpty(this)"><br><br>

</fieldset>

<fieldset>
<legend>Application Information</legend>

<label>Mobile Number:</label>
<input type="text" id="no" required onblur="checkEmpty(this)"><br><br>

<label>Grade Level:</label>
<select id="gLevel" required>
  <option value="">Select Grade</option>
  <option value="Grade 7">Grade 7</option>
  <option value="Grade 8">Grade 8</option>
  <option value="Grade 9">Grade 9</option>
  <option value="Grade 10">Grade 10</option>
  <option value="Grade 11">Grade 11</option>
  <option value="Grade 12">Grade 12</option>
</select><br><br>

<legend>Intern / Extern</legend>

<input type="radio" name="type" value="Intern" required> Intern<br>
<input type="radio" name="type" value="Extern" required> Extern<br><br>

<label>Preferred Organization/Club:</label>
<select id="club" required>
  <option value="">Select Club</option>
  <option value="Alianti">Alianti</option>
  <option value="Labuyo">Labuyo</option>
  <option value="Himig">Himig</option>
  <option value="Palastro">Palastro</option>
  <option value="Flux">Flux</option>
</select><br><br>

<label>Why do you want to join:</label><br>
<textarea id="why" rows="5" cols="67" required onblur="checkEmpty(this)"></textarea>

</fieldset>

<br>
<input type="submit" value="Submit">
<input type="reset" value="Reset">

</form>

</body>
</html>
